# Development infrastructure only — not what runs in any deployed environment.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saathiride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saathiride}
      POSTGRES_DB: ${POSTGRES_DB:-saathiride}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - saathiride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-saathiride}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saathiride_postgres_data:
